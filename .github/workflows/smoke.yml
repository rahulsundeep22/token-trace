name: smoke test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile
        run: python -m compileall -q tt tokentrace.py

      - name: CLI starts
        run: python tokentrace.py --help

      - name: Empty database report
        env:
          TOKENTRACE_HOME: ${{ runner.temp }}/tokentrace-ci
        run: python tokentrace.py report --days 0
